version: '3.8'

services:
  # 1. Dịch vụ Backend E-commerce
  ecommerce-api:
    image: your-ecommerce-api-image:v1.0
    container_name: ecommerce-api
    ports:
      - "8080:8080"
    networks:
      - monitoring-net
    restart: always

  # 2. Dịch vụ Prometheus giám sát
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle' 
      - monitoring-net
    restart: always

networks:
  monitoring-net:
    driver: bridge